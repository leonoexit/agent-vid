<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pop · Kho asset</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#282332;background:#f5f3f0;--stage:#e7e0f4}*{box-sizing:border-box}body{margin:0}header{padding:38px 5vw 24px;border-bottom:1px solid #ddd6cd}header small{font-size:12px;letter-spacing:2px;color:#70508e}h1{font-size:36px;letter-spacing:-1.5px;margin:8px 0}header p{color:#6e6577;max-width:760px;line-height:1.6;margin-bottom:0}.tools{position:sticky;top:0;z-index:2;padding:18px 5vw;display:flex;gap:12px;flex-wrap:wrap;background:#f5f3f0f5;backdrop-filter:blur(12px)}input,select,button{font:inherit;border:1px solid #d4cbdc;border-radius:12px;background:white;padding:11px 14px;color:inherit}input{flex:1;min-width:230px}button{cursor:pointer}button:hover{border-color:#7546d9}button:focus-visible,a:focus-visible{outline:3px solid #7546d9;outline-offset:3px}.stats{padding:0 5vw 18px;font-size:13px;color:#74677e}.grid{padding:0 5vw 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.card{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;background:#fff;border:1px solid #e3dce7;border-radius:20px;transition:transform .18s}.card:hover{transform:translateY(-3px)}.preview{width:100%;flex-shrink:0;height:220px;display:flex;align-items:center;justify-content:center;background-color:var(--stage);background-image:linear-gradient(45deg,#ffffff28 25%,transparent 25%),linear-gradient(-45deg,#ffffff28 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff28 75%),linear-gradient(-45deg,transparent 75%,#ffffff28 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.preview img{max-width:90%;max-height:90%;object-fit:contain;filter:drop-shadow(2px 7px 3px #30204020)}.copy{padding:18px;width:100%;flex:1}.copy h2{font-size:17px;margin:6px 0 10px}.label{font-size:11px;letter-spacing:.7px;color:#7546d9;text-transform:uppercase}.tags{font-size:12px;color:#716775;line-height:1.6}.foot{border-top:1px solid #eee8f0;padding-top:12px;margin-top:12px;font-size:11px;color:#8a7f90}.empty{grid-column:1/-1;padding:60px 0;color:#75647e}dialog{width:min(1050px,95vw);border:0;border-radius:24px;padding:0;max-height:92vh;box-shadow:0 30px 100px #22113455}dialog::backdrop{background:#17102180;backdrop-filter:blur(5px)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #eee}.detail{display:grid;grid-template-columns:1fr 1fr}.hero{min-height:380px;height:auto;padding:30px;align-self:start;position:sticky;top:0}.hero img{max-height:480px}.info{padding:24px;overflow-wrap:anywhere}h3{margin:0 0 12px;font-size:25px}dl{font-size:13px;line-height:1.6}dt{font-weight:600;margin-top:14px;color:#75647e}dd{margin:4px 0}a{color:#6740b5}pre{font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap;background:#f4f0f8;padding:14px;border-radius:12px}summary{cursor:pointer;font-size:13px;font-weight:600;margin:18px 0}#copy-status{font-size:12px;color:#6c557e;margin-left:8px}@media(max-width:700px){.detail{grid-template-columns:1fr}.hero{position:static;min-height:230px}.hero img{max-height:250px}h1{font-size:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.preview{height:170px}.copy{padding:12px}.copy h2{font-size:14px}}
</style></head><body><header><small>POP / ASSET LIBRARY</small><h1>Ảnh tốt, dùng tiếp.</h1><p>Vật thể, mảnh giấy và chữ cắt ghép cho những câu chuyện tiếp theo. Xem chất hình và nguồn trước khi chọn; mỗi project dùng một bản sao độc lập.</p></header><div class="tools"><input id="query" type="search" aria-label="Tìm asset" placeholder="Tìm máy tính, lưu trữ, giấy xé, Linus…"><select id="category" aria-label="Loại asset"><option value="">Tất cả loại</option value="object">Vật thể</option><option value="paper">Giấy / nhãn trống</option><option value="lettering">Chữ có sẵn</option><option value="person">Người thật</option></select><select id="family" aria-label="Bộ asset"><option value="">Tất cả bộ</option></select><select id="stage" aria-label="Nền xem trước"><option value="#e7e0f4">Nền tím nhạt</option><option value="#7546d9">Nền tím đậm</option><option value="#fff064">Nền vàng</option><option value="#ffffff">Nền trắng</option><option value="#282332">Nền tối</option></select></div><div id="stats" class="stats" aria-live="polite"></div><main id="grid" class="grid"></main><dialog id="detail"><div class="modal-head"><span>Chi tiết asset</span><button id="close" aria-label="Đóng chi tiết">Đóng ×</button></div><div class="detail"><div class="preview hero"><img id="hero" alt=""></div><div class="info"><div id="kind" class="label"></div><h3 id="name"></h3><p id="description"></p><button id="copy">Sao chép ID</button><span id="copy-status" aria-live="polite"></span><dl id="facts"></dl><p><a id="original" target="_blank">Mở ảnh gốc</a> · <a id="metadata" target="_blank">Metadata JSON</a></p><details><summary>Prompt / nguồn đầy đủ</summary><pre id="origin"></pre></details></div></div></dialog><script>
const DATA=/*LIBRARY_DATA*/;
const $=id=>document.getElementById(id),names={object:'Vật thể',paper:'Giấy / nhãn trống',lettering:'Chữ có sẵn',person:'Người thật'};
const normalize=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replaceAll('đ','d');
let current;
for(const f of [...new Set(DATA.assets.map(a=>a.family))].sort()){const o=document.createElement('option');o.value=f;o.textContent=f;$('family').append(o)}
function uses(a){return DATA.usage.filter(v=>v.assets.some(x=>x.id===a.id)).map(v=>v.project)}
function detail(a){current=a;$('hero').src=a.file;$('hero').alt=a.name;$('name').textContent=a.name;$('kind').textContent=names[a.category];$('description').textContent=a.description;$('copy-status').textContent='';$('facts').replaceChildren();const vals={'ID':a.id,'Từ khoá':a.tags.join(' · '),'Vai trò / trạng thái':a.roles.join(', ')+' / '+a.states.join(', '),'Bộ / biến thể':a.family+(a.variant_of?' ← '+a.variant_of:' · không khai báo biến thể'),'Kích thước / alpha':`${a.width} × ${a.height} · ${a.has_transparency?'Có nền trong suốt':'Ảnh kín nền'}`,'Vùng chữ [x,y,w,h]':a.safe_text_rect?JSON.stringify(a.safe_text_rect):'Không có vùng chữ đăng ký','Nguồn / quyền dùng':a.rights.note,'Đánh giá':a.review.status+' — '+a.review.note,'Đã dùng trong':uses(a).join('\n')||'Chưa ghi nhận video hoàn chỉnh'};for(const [k,v] of Object.entries(vals)){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;dd.style.whiteSpace='pre-line';$('facts').append(dt,dd)}$('original').href=a.file;$('metadata').href='items/'+a.id+'/metadata.json';$('origin').textContent=JSON.stringify(a.origin,null,2);$('detail').showModal()}
function render(){const terms=normalize($('query').value).split(/\s+/).filter(Boolean),items=DATA.assets.filter(a=>a.review.status!=='rejected'&&(!$('category').value||a.category===$('category').value)&&(!$('family').value||a.family===$('family').value)&&terms.every(t=>normalize([a.id,a.name,a.description,a.family,...a.tags,...a.roles,...a.states].join(' ')).includes(t)));$('stats').textContent=`${items.length} / ${DATA.assets.length} asset · Tìm có hoặc không dấu · Hình trong kho không đồng nghĩa đã được duyệt riêng`;$('grid').replaceChildren();for(const a of items){const card=document.createElement('button');card.className='card';card.setAttribute('aria-label','Xem '+a.name);const preview=document.createElement('div');preview.className='preview';const im=document.createElement('img');im.src=a.thumbnail;im.alt=a.name;im.loading='lazy';preview.append(im);const copy=document.createElement('div');copy.className='copy';const label=document.createElement('div');label.className='label';label.textContent=names[a.category];const title=document.createElement('h2');title.textContent=a.name;const tags=document.createElement('div');tags.className='tags';tags.textContent=a.tags.slice(0,4).join(' · ');const foot=document.createElement('div');foot.className='foot';foot.textContent=`${uses(a).length} video · ${a.width} × ${a.height}`;copy.append(label,title,tags,foot);card.append(preview,copy);card.onclick=()=>detail(a);$('grid').append(card)}if(!items.length){const e=document.createElement('p');e.className='empty';e.textContent='Chưa có kết quả. Thử một từ ngắn hơn hoặc bỏ bộ lọc.';$('grid').append(e)}}
$('query').oninput=render;$('category').onchange=render;$('family').onchange=render;$('stage').onchange=()=>document.documentElement.style.setProperty('--stage',$('stage').value);$('close').onclick=()=>$('detail').close();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(current.id);$('copy-status').textContent='Đã sao chép'}catch{$('copy-status').textContent=current.id}};render();
</script></body></html>
