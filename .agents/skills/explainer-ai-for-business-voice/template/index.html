<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Narrated Explainer</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Layout zones only (px, 1080x1920). Colours, fonts and backgrounds come from theme.css via CSS variables. -->
    <style>
      body { margin: 0; background: var(--paper); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font-body); color: var(--ink); }
      /* No lonely last word: every block wraps 'pretty' (inherited); short centred headings are balanced. */
      #root { text-wrap: pretty; }
      .title-text, .big, .intro-sub, .big-sub, .note-text { text-wrap: balance; }
      #paper { position: absolute; inset: 0; display: block; background: var(--paper); }
      #grain { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; opacity: var(--grain-opacity, 0); mix-blend-mode: multiply; }
      #stage { position: absolute; inset: 0; }
      .scene { position: absolute; inset: 0; opacity: 0; }
      .mono { font-family: var(--font-mono); font-weight: 700; }
      .accent { color: var(--accent); }
      img.mascot, img.prop, .title-img { mix-blend-mode: var(--art-blend, normal); display: block; }

      /* intro */
      .prompt { position: absolute; left: 80px; top: 260px; width: 880px; height: 88px; display: flex; align-items: center; padding: 0 28px; box-sizing: border-box;
        border: 4px solid var(--ink); border-radius: 10px; background: var(--surface); font: 700 38px var(--font-mono); }
      .caret { color: var(--accent); margin-left: 4px; }
      .big { position: absolute; left: 60px; right: 60px; top: 520px; display: block; text-align: center; font-family: var(--font-display); font-size: 96px; line-height: 1.15; }
      .big2 { top: 700px; font-size: 84px; }
      .big2 .accent { display: inline-block; }
      .underline { width: 520px; height: 8px; margin: 6px auto 0; border-radius: 4px; background: var(--accent); transform-origin: left center; display: block; }
      .intro-mascot { position: absolute; left: 60px; top: 1050px; width: 260px; }
      .trail { position: absolute; left: 0; top: 1150px; width: 1080px; height: 400px; display: block; color: var(--trail, var(--ink)); }
      .intro-title { position: absolute; left: 0; right: 0; top: 640px; display: block; opacity: 0; }
      .intro-sub { text-align: center; font-size: 56px; margin-top: 30px; color: var(--muted); }

      /* title block (image sign or pure-CSS box, per theme) */
      .title-box { position: relative; width: 900px; height: 258px; margin: 0 auto; }
      .title-img { position: absolute; inset: 0; width: 900px; height: 258px; }
      .title-text { position: absolute; left: 90px; right: 90px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; text-align: center;
        font-family: var(--font-display); font-size: 60px; line-height: 1.1; }
      .scene-title { position: absolute; left: 0; right: 0; top: 150px; display: block; }
      .badge { position: absolute; left: 70px; top: -26px; width: 100px; height: 100px; border-radius: 50%; border: 5px solid var(--accent); background: var(--badge-bg);
        display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--accent); }

      /* main card; widgets draw inside it (each widget file injects its own CSS) */
      .card { position: absolute; left: 80px; top: 450px; width: 920px; height: 560px; box-sizing: border-box; padding: 30px 34px;
        border: 5px solid var(--ink); border-radius: 10px; background: var(--surface); box-shadow: 8px 8px 0 var(--shadow); }
      .prop { position: absolute; right: 26px; top: 20px; width: 230px; }

      /* notes + mascot */
      .note { position: absolute; left: 80px; box-sizing: border-box; padding: 18px 26px; border: 4px solid var(--ink); border-radius: 8px; background: var(--note-bg); }
      .note-before { top: 1050px; width: 920px; }
      .note-after { top: 1230px; width: 620px; }
      .note-label { font-size: 28px; color: var(--muted-2); }
      .note-text { font-size: 38px; line-height: 1.2; margin-top: 4px; }
      .scene-mascot { position: absolute; left: 740px; top: 1160px; width: 235px; }

      /* outro */
      .big-sub { top: 700px; font-size: 60px; color: var(--muted); }
      .outro-title { position: absolute; left: 0; right: 0; top: 960px; display: block; }
      .outro-title .title-text { font-size: 54px; }
      .outro-mascot { position: absolute; left: 420px; top: 1150px; width: 240px; }
      .credit { position: absolute; left: 0; right: 0; top: 1810px; display: block; text-align: center; font-size: 30px; color: var(--muted-2); }

      /* Karaoke captions live in the bottom band (y 1625-1775), above the watermark. */
      .captions { position: absolute; left: 60px; right: 60px; top: 1625px; height: 150px; display: block; }
      .cap-line { position: absolute; left: 0; right: 0; top: 0; display: block; text-align: center; opacity: 0; font-size: 52px; line-height: 1.25; color: var(--ink); }
      .cap-pill { display: inline-block; max-width: 940px; padding: 6px 24px 10px; border: 3px solid var(--ink); border-radius: 20px;
        background: var(--pill-bg); box-shadow: 5px 5px 0 var(--shadow); }
      .cap-word { display: inline; }
      #watermark { position: absolute; right: 24px; bottom: 24px; width: 96px; height: 96px; display: block; opacity: 0.5; }

      /* Scene layouts (scene.layout, else THEME.layout): notes (default above) | card | speaker. */
      .layout-card .card { left: 34px; top: 420px; zoom: 1.1; }
      .layout-card .note-before { display: none; }
      .layout-card .note-after { left: 34px; top: 1120px; width: 800px; }
      .layout-card .scene-mascot { left: 850px; top: 1085px; width: 200px; }
      .layout-speaker .scene-mascot { left: 50px; top: 1050px; width: 300px; max-height: 520px; object-fit: contain; object-position: top; }
      .layout-speaker .note-before { left: 400px; top: 1050px; width: 620px; padding: 12px 22px; }
      .layout-speaker .note-before .note-text { font-size: 30px; }
      .layout-speaker .note-after { left: 400px; top: 1175px; width: 620px; padding: 22px 30px; border-radius: 34px; }
      .layout-speaker .note-after .note-text { font-size: 42px; }
    </style>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="palette.css" />
  </head>
  <body>
    <div id="root" data-composition-id="narrated-explainer" data-width="1080" data-height="1920" data-duration="60">
      <section id="explainer" class="clip" data-start="0" data-duration="60" data-track-index="1" style="position:absolute;inset:0">
        <div id="paper"></div>
        <svg id="grain" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" /><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0.9 0" /></filter>
          <rect width="1080" height="1920" filter="url(#noise)" />
        </svg>
        <div id="stage"></div>
        <img id="watermark" src="assets/watermark.png" alt="" />
      </section>
      <!-- AUDIO:BEGIN -->
      <!-- AUDIO:END -->
    </div>
    <script src="theme.js"></script>
    <script src="project-data.js"></script>
    <script src="explainer-core.js"></script>
    <!-- WIDGETS:BEGIN -->
    <script src="widgets/intro-notify.js"></script>
    <script src="widgets/transition-sweep.js"></script>
    <script src="widgets/caption-underline.js"></script>
    <script src="widgets/outro-start.js"></script>
    <script src="widgets/day-timeline.js"></script>
    <script src="widgets/before-after.js"></script>
    <script src="widgets/flow-3step.js"></script>
    <script src="widgets/chat.js"></script>
    <script src="widgets/stat.js"></script>
    <script src="widgets/analogy.js"></script>
    <script src="widgets/checklist.js"></script>
    <script src="widgets/load-meter.js"></script>
    <script src="widgets/fan-out.js"></script>
    <script src="widgets/delegate-split.js"></script>
    <!-- WIDGETS:END -->
    <script src="explainer-engine.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["narrated-explainer"] = window.ExplainerTimeline;
    </script>
  </body>
</html>
