<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Hero Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-text: #ffffff;
      --color-accent: #3b82f6;
      --font-main: 'Sora', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
    }

    .slide {
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
      page-break-after: always;
    }

    /* Hero Image */
    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Cinematic Overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(0, 0, 0, 0.8) 0%,
        rgba(0, 0, 0, 0.4) 50%,
        rgba(0, 0, 0, 0.2) 100%
      );
    }

    /* Grain Texture */
    .grain {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
    }

    /* Content */
    .content {
      position: absolute;
      inset: 0;
      padding: 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .eyebrow {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--color-accent);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--color-text);
      letter-spacing: -0.02em;
      max-width: 800px;
      margin-bottom: 24px;
    }

    .description {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      max-width: 600px;
    }

    /* Decorative Elements */
    .corner-accent {
      position: absolute;
      top: 60px;
      right: 60px;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
    }

    .corner-accent::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      width: 100%;
      height: 100%;
      border: 2px solid var(--color-accent);
      border-radius: 20px;
    }

    /* Print styles */
    @media print {
      .slide { margin: 0; }
    }
  </style>
</head>
<body>
  <div class="slide">
    <!-- Replace with real Unsplash/Pexels image URL -->
    <img 
      class="hero-image" 
      src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=1920&q=80" 
      alt="Modern office space with team collaboration"
    >
    
    <div class="overlay"></div>
    <div class="grain"></div>
    
    <div class="corner-accent"></div>
    
    <div class="content">
      <p class="eyebrow">Chapter 03</p>
      <h1>Transform Your Vision Into Reality</h1>
      <p class="description">
        A powerful statement that captures the essence of your message 
        and inspires your audience to take action.
      </p>
    </div>
  </div>
</body>
</html>
