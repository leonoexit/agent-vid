<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover Slide - Brutalist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #000000;
      --color-accent: #ff3366;
      --color-accent-2: #ffff00;
      --color-bg: #ffffff;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Work Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    .slide {
      width: 1280px;
      height: 720px;
      background: var(--color-bg);
      border: 6px solid var(--color-primary);
      position: relative;
      overflow: hidden;
      page-break-after: always;
    }

    /* Exposed Grid */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Accent Block */
    .accent-block {
      position: absolute;
      top: 60px;
      right: 80px;
      width: 200px;
      height: 200px;
      background: var(--color-accent);
      transform: rotate(-3deg);
      box-shadow: 10px 10px 0 var(--color-primary);
    }

    .accent-block-2 {
      position: absolute;
      bottom: 100px;
      left: 100px;
      width: 120px;
      height: 120px;
      background: var(--color-accent-2);
      transform: rotate(5deg);
      box-shadow: 8px 8px 0 var(--color-primary);
    }

    /* Content */
    .content {
      position: absolute;
      top: 50%;
      left: 80px;
      transform: translateY(-50%);
      max-width: 800px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 140px;
      line-height: 0.85;
      text-transform: uppercase;
      color: var(--color-primary);
      letter-spacing: 0.02em;
    }

    h1 span {
      display: block;
      color: var(--color-accent);
    }

    .subtitle {
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 600;
      margin-top: 30px;
      padding: 15px 25px;
      background: var(--color-primary);
      color: var(--color-bg);
      display: inline-block;
      transform: rotate(-1deg);
    }

    .meta {
      position: absolute;
      bottom: 60px;
      left: 80px;
      font-size: 18px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Print styles */
    @media print {
      .slide { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="grid-overlay"></div>
    <div class="accent-block"></div>
    <div class="accent-block-2"></div>
    
    <div class="content">
      <h1>BIG BOLD<br><span>STATEMENT</span></h1>
      <p class="subtitle">Subtitle goes here →</p>
    </div>
    
    <div class="meta">Presenter • Date</div>
  </div>
</body>
</html>
