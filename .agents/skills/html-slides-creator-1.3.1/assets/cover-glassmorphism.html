<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover Slide - Glassmorphism</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-text: #ffffff;
      --color-text-muted: rgba(255, 255, 255, 0.7);
      --color-accent: #a855f7;
      --color-accent-light: #c084fc;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --font-main: 'Outfit', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
    }

    .slide {
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
      page-break-after: always;
    }

    /* Animated Aurora Background */
    .bg-wrapper {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 25%, #4c1d95 50%, #6b21a8 75%, #86198f 100%);
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 20s ease-in-out infinite;
    }

    .bg-orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #ec4899 0%, transparent 70%);
      top: -150px;
      right: -100px;
    }

    .bg-orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
      bottom: -100px;
      left: -80px;
      animation-delay: -7s;
    }

    .bg-orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
      top: 40%;
      left: 30%;
      animation-delay: -14s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -30px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(-30px, -20px) scale(1.02); }
    }

    /* Glass Card */
    .glass-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 60px 80px;
      text-align: center;
      color: var(--color-text);
    }

    h1 {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    h1 span {
      background: linear-gradient(135deg, #f472b6, #c084fc, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 24px;
      color: var(--color-text-muted);
      margin-bottom: 40px;
    }

    .meta {
      font-size: 16px;
      color: var(--color-text-muted);
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    /* Print styles */
    @media print {
      .slide { margin: 0; box-shadow: none; }
      .bg-orb { animation: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-orb { animation: none; }
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-wrapper">
      <div class="bg-orb bg-orb-1"></div>
      <div class="bg-orb bg-orb-2"></div>
      <div class="bg-orb bg-orb-3"></div>
    </div>
    
    <div class="glass-card">
      <h1>Your <span>Amazing</span> Title</h1>
      <p class="subtitle">A compelling subtitle that captures attention</p>
      <div class="meta">
        <span>Presenter Name</span>
        <span>•</span>
        <span>Date</span>
      </div>
    </div>
  </div>
</body>
</html>
