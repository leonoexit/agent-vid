<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Connectors Layer -->
  <g id="connectors" stroke="#003366" stroke-width="3">
    <!-- Level 0 to 1 -->
    <line x1="400" y1="80" x2="200" y2="200" />
    <line x1="400" y1="80" x2="600" y2="200" />
    <!-- Level 1 to 2 -->
    <line x1="200" y1="200" x2="100" y2="320" />
    <line x1="200" y1="200" x2="300" y2="320" />
  </g>

  <!-- Nodes Layer -->
  <g id="nodes">
    <!-- Root -->
    <circle cx="400" cy="80" r="35" fill="#003366" stroke="black" stroke-width="2" />
    <text x="400" y="80" dy=".3em" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">100</text>
    
    <!-- L1 Left -->
    <circle cx="200" cy="200" r="35" fill="#003366" stroke="black" stroke-width="2" />
    <text x="200" y="200" dy=".3em" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">80</text>
    
    <!-- L1 Right -->
    <circle cx="600" cy="200" r="35" fill="#003366" stroke="black" stroke-width="2" />
    <text x="600" y="200" dy=".3em" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">90</text>

    <!-- L2 Left-Left -->
    <circle cx="100" cy="320" r="35" fill="#003366" stroke="black" stroke-width="2" />
    <text x="100" y="320" dy=".3em" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">40</text>

    <!-- L2 Left-Right -->
    <circle cx="300" cy="320" r="35" fill="#003366" stroke="black" stroke-width="2" />
    <text x="300" y="320" dy=".3em" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">50</text>
  </g>
</svg>
