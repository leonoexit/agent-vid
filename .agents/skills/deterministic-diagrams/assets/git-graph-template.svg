<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Connectors Layer -->
  <g id="connectors" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <!-- Main Branch Line -->
    <path d="M 50 200 L 750 200" />
    
    <!-- Feature Branch Launch (Curved) -->
    <!-- From C2 (Main) to F1 (Feature) -->
    <path d="M 250 200 C 250 200, 300 120, 350 120 L 550 120" />
    
    <!-- Merge Back -->
    <!-- From F2 (Feature) to C5 (Main) -->
    <path d="M 550 120 C 600 120, 600 200, 650 200" />
  </g>

  <!-- Nodes Layer -->
  <g id="commits">
    <!-- Commit 1 (Main) -->
    <circle cx="150" cy="200" r="15" fill="#0f172a" stroke="white" stroke-width="2" />
    <text x="150" y="235" text-anchor="middle" font-family="monospace">init</text>

    <!-- Commit 2 (Main) -->
    <circle cx="250" cy="200" r="15" fill="#0f172a" stroke="white" stroke-width="2" />
    <text x="250" y="235" text-anchor="middle" font-family="monospace">c1</text>

    <!-- Feature Commit 1 -->
    <circle cx="350" cy="120" r="15" fill="#3b82f6" stroke="white" stroke-width="2" />
    <text x="350" y="90" text-anchor="middle" font-family="monospace" fill="#3b82f6">feat-a</text>

    <!-- Feature Commit 2 -->
    <circle cx="450" cy="120" r="15" fill="#3b82f6" stroke="white" stroke-width="2" />
    <text x="450" y="90" text-anchor="middle" font-family="monospace" fill="#3b82f6">feat-b</text>

    <!-- Merge Commit (Main) -->
    <circle cx="650" cy="200" r="15" fill="#0f172a" stroke="white" stroke-width="2" />
    <text x="650" y="235" text-anchor="middle" font-family="monospace">merge</text>
  </g>
</svg>
