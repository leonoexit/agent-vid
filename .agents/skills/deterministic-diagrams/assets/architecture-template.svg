<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Connectors -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5">
    <!-- LB to Web 1 -->
    <line x1="400" y1="100" x2="250" y2="250" />
    <!-- LB to Web 2 -->
    <line x1="400" y1="100" x2="400" y2="250" />
    <!-- LB to Web 3 -->
    <line x1="400" y1="100" x2="550" y2="250" />
    
    <!-- Web 1 to DB -->
    <line x1="250" y1="250" x2="400" y2="400" />
    <!-- Web 2 to DB -->
    <line x1="400" y1="250" x2="400" y2="400" />
    <!-- Web 3 to DB -->
    <line x1="550" y1="250" x2="400" y2="400" />
  </g>

  <!-- Tier 1: Load Balancer -->
  <rect x="340" y="70" width="120" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" />
  <text x="400" y="105" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#0284c7">LB</text>

  <!-- Tier 2: Web Servers -->
  <rect x="190" y="220" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3" />
  <text x="250" y="255" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#16a34a">Web 01</text>

  <rect x="340" y="220" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3" />
  <text x="400" y="255" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#16a34a">Web 02</text>

  <rect x="490" y="220" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3" />
  <text x="550" y="255" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#16a34a">Web 03</text>

  <!-- Tier 3: Database -->
  <path d="M 340 380 L 340 430 C 340 445, 460 445, 460 430 L 460 380 C 460 365, 340 365, 340 380 Z" 
        fill="#fae8ff" stroke="#9333ea" stroke-width="3" />
  <path d="M 340 380 C 340 395, 460 395, 460 380" fill="none" stroke="#9333ea" stroke-width="2" />
  <text x="400" y="415" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#9333ea">Primary DB</text>
</svg>
