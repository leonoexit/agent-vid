<!doctype html><html lang="vi"><meta charset="utf-8"><title>Code Noir — native assets</title><style>@font-face{font-family:Mono;src:url(fonts/code-mono.woff2)}body{background:#000;color:#e5e5e5;font:22px Mono;padding:64px}h1{font-size:36px}main{display:flex;gap:40px;flex-wrap:wrap}.asset{width:160px;display:grid;gap:24px;color:#8be9fd}p{max-width:900px;line-height:1.6;color:#a2a2a2}small{color:#e5e5e5}</style><h1>Code Noir / visual anchors</h1><p>Cùng một bộ nét. Chọn vật thể theo vai trò trong lời giải thích: điểm neo, nơi nhận, vật được tìm hoặc trạng thái thay đổi. Đây là bảng asset, không phải video hoàn chỉnh.</p><main></main><script src="js/noir-visuals.js"></script><script>for(const n of ['terminal','shell','folder','file','pin','keyboard','check','cross']){const el=document.createElement('div');el.className='asset';el.append(NoirVisuals.icon(n,{size:100}));const label=document.createElement('small');label.textContent=n;el.append(label);document.querySelector('main').append(el);}</script></html>
