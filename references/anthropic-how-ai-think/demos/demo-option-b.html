<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option B: The Digital MRI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
        }
        .slide-container {
            width: 1200px;
            height: 1200px;
            background-color: #0a0a0a;
            position: relative;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            border: 1px solid #1f1f1f;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
            display: none; /* Static for now */
        }
        .heatmap-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(94, 234, 212, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>

    <div class="slide-container p-12 flex flex-col relative">
        <div class="heatmap-blob top-0 right-0"></div>
        <div class="heatmap-blob bottom-0 left-0" style="background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0,0,0,0) 70%);"></div>

        <!-- Watermark -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-50 opacity-10">
            <span class="text-7xl font-black uppercase tracking-widest text-white">@lenguyen.codeai</span>
        </div>

        <!-- UI Chrome -->
        <div class="flex justify-between items-center mb-16 border-b border-gray-800 pb-6 z-20">
            <div class="mono text-2xl text-[#00ff88] tracking-wider">
                > SYSTEM_SCAN: ACTIVE
            </div>
            <div class="mono text-2xl text-gray-500">
                L:01 // T:00:00
            </div>
        </div>

        <!-- Content -->
        <div class="flex-1 z-20 flex flex-col justify-center">
            
            <div class="inline-block mb-8">
                <span class="mono border border-[#00ff88] text-[#00ff88] px-4 py-2 rounded text-lg uppercase tracking-widest bg-[#00ff88]/10">
                    Anomaly Detected
                </span>
            </div>

            <h1 class="text-7xl font-black leading-tight mb-12 tracking-tight">
                Khi bạn trò chuyện với một <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00ff88] to-[#00b8ff] glow-text">AI Model</span>...
            </h1>

            <div class="bg-gray-900/50 border border-gray-700 p-10 backdrop-blur-sm rounded-xl border-l-4 border-l-[#a855f7]">
                <p class="text-5xl leading-snug font-medium text-gray-200">
                    "Thực ra bạn đang tương tác với <span class="text-white font-bold italic border-b-4 border-[#a855f7]">thực thể</span> nào?"
                </p>
                <div class="mt-10 grid grid-cols-2 gap-6 mono text-xl opacity-80">
                    <div class="flex items-center gap-3 text-red-400">
                        <span>[x] Glorified Autocomplete</span>
                    </div>
                    <div class="flex items-center gap-3 text-red-400">
                        <span>[x] Search Engine</span>
                    </div>
                    <div class="flex items-center gap-3 text-[#00ff88] col-span-2">
                        <span>[?] UNKNOWN BIOLOGICAL FORM</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-auto pt-8 flex justify-between items-end z-20">
            <div class="text-sm mono text-gray-600 w-1/3">
                ID: A-302<br>
                Sub: Interpretability
            </div>
            <div class="w-20 h-20 rounded-full border border-gray-700 flex items-center justify-center font-bold text-3xl mono text-[#00ff88] bg-gray-900 shadow-lg shadow-[#00ff88]/20">
                01
            </div>
        </div>
    </div>

</body>
</html>
