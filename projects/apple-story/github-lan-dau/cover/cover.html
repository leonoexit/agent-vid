<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080, height=1920"><title>Cover · Lần đầu dùng GitHub</title><link rel="stylesheet" href="../theme.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f7f8f6}
#cover{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f7f8f6}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.k{position:absolute;left:0;right:0;text-align:center}
.kicker{top:300px;font:700 30px AppleSans;letter-spacing:4px;color:#6a6e74}
.kicker i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#ee4e82;margin-right:16px;vertical-align:4px}
.h1{top:362px;font:780 146px/1.02 AppleSans;letter-spacing:-6.5px;color:#161719}
.h2{top:690px;font:780 96px/1.05 AppleSans;letter-spacing:-4px;padding-bottom:10px}
.sub{top:812px;font:560 38px AppleSans;color:#4f5560;letter-spacing:-.5px}
.sub b{font-family:AppleMono;font-weight:650;color:#5a3fd6;padding:2px 12px;border-radius:12px;background:#ece8ff}
.sub b.c{color:#006f6f;background:#dcf6ee}
.place{position:absolute;transform:translate(-50%,-50%)}
.join{position:absolute;left:540px;top:1100px;transform:translate(-50%,-50%);font:300 110px AppleSans;color:#9aa1a9}
.tile .label.mono{font-size:.1em}
.rail{position:absolute;left:150px;top:1452px;width:780px;height:7px;border-radius:4px;background:#d5dbe2}
.bead{position:absolute;transform:translate(-50%,-50%)}
.bl{position:absolute;transform:translateX(-50%);top:1520px;font:600 28px AppleMono;color:#2b2f36;white-space:nowrap;text-align:center}
.bl small{display:block;font:560 23px AppleSans;color:#5f656c;margin-top:4px}
.cta{position:absolute;left:50%;top:1680px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:22px 40px 22px 24px;border-radius:60px;background:linear-gradient(135deg,#fff,#f2f4f7);border:2px solid #fff;box-shadow:0 18px 36px -18px #24334866,0 3px 0 #e3e7ec;font:680 36px AppleSans;color:#2b2f36;white-space:nowrap;letter-spacing:-.5px}
.cta .play{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#f78a6f,#ee4e82 55%,#be40ad);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px -8px #ee4e8299}
.foot{position:absolute;left:90px;right:90px;top:1830px;display:flex;justify-content:space-between;font:650 22px AppleSans;letter-spacing:2.4px;color:#6a6e74}
.ban{position:absolute;left:880px;top:1300px;width:120px;height:120px;transform:rotate(-14deg)}
</style></head><body>
<div id="cover">

 <div class="foot"><span>AGENTVID · NGƯỜI MỚI</span><span>2 PHÚT</span></div>
</div>
